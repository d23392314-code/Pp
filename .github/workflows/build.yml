name: Build ESP32-S3 Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core + libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "ArduinoJson"

      - name: Compile
        # Sketch harus di folder dengan nama sama: Xiaozhi_Qwen_ESP32S3/Xiaozhi_Qwen_ESP32S3.ino
        # PSRAM=opi untuk board N8R8/N16R8 (Freenove WROOM CAM). Kalau board kamu PSRAM quad, ganti jadi PSRAM=enabled
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32s3:PSRAM=opi,PartitionScheme=huge_app,FlashSize=8M,CDCOnBoot=cdc \
            --output-dir build \
            Xiaozhi_Qwen_ESP32S3

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: build/*.bin
