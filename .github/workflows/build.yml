name: Build ESP32-S3 Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32

      - name: Install libraries
        run: |
          arduino-cli lib install "Adafruit GFX Library"
          arduino-cli lib install "Adafruit BusIO"
          arduino-cli lib install "Adafruit ST7735 and ST7789 Library"
          arduino-cli lib install "ArduinoJson"

      # Cari file .ino otomatis (nama folder/file bebas), lalu siapkan folder sketch
      # yang namanya cocok dengan nama .ino (syarat wajib Arduino).
      - name: Prepare sketch
        run: |
          INO=$(find . -name "*.ino" -not -path "./.git/*" -not -path "./build_sketch/*" | head -n 1)
          if [ -z "$INO" ]; then
            echo "Tidak ada file .ino di repo!"
            exit 1
          fi
          echo "Sketch ditemukan: $INO"
          NAME=$(basename "$INO" .ino)
          mkdir -p "build_sketch/$NAME"
          cp "$INO" "build_sketch/$NAME/$NAME.ino"
          echo "SKETCH_DIR=build_sketch/$NAME" >> $GITHUB_ENV

      - name: Compile
        run: |
          arduino-cli compile \
            --fqbn "esp32:esp32:esp32s3:PSRAM=opi,FlashSize=16M,PartitionScheme=default_16MB" \
            --warnings default \
            --output-dir out \
            "$SKETCH_DIR"

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware-esp32s3
          path: |
            out/*.bin
            out/*.elf
